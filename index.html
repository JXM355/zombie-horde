<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b0d12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="僵尸国度">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<title>僵尸国度 · Zombie Horde</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0d12; }
  body { font-family: -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif; user-select: none; -webkit-user-select: none; }
  #game { position: fixed; inset: 0; display: block; cursor: crosshair; touch-action: none; }

  #hud { position: fixed; inset: 0; pointer-events: none; color: #eee; z-index: 5; }
  .top { position: absolute; top: 12px; left: 14px; right: 14px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .panel { background: rgba(15,18,26,0.72); border: 1px solid #2a2f3a; border-radius: 10px; padding: 8px 12px; backdrop-filter: blur(4px); }
  .bar { width: 180px; height: 12px; background: #222630; border-radius: 6px; overflow: hidden; }
  #hp-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #ef5350, #ff8a80); transition: width .12s linear; }
  #hp-text { display: block; font-size: 11px; margin-top: 3px; color: #ccc; }
  .center { text-align: center; }
  #wave-text { font-size: 20px; font-weight: 700; color: #ffd54f; text-shadow: 0 1px 4px rgba(0,0,0,0.6); }
  #enemies-text { font-size: 12px; color: #bbb; margin-top: 2px; }
  .stats { text-align: right; font-size: 13px; line-height: 1.7; color: #cfd4dd; }

  .xp-wrap { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); width: min(420px, 60vw); text-align: center; }
  .xp-bar { width: 100%; height: 10px; background: rgba(15,18,26,0.72); border: 1px solid #2a2f3a; border-radius: 6px; overflow: hidden; }
  #xp-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #66bb6a, #b9f6ca); transition: width .12s linear; }
  #level-text { display: inline-block; font-size: 13px; color: #a5d6a7; margin-top: 4px; font-weight: 600; }
  #buffs { position: absolute; top: 84px; left: 16px; font-size: 18px; letter-spacing: 2px; max-width: 40vw; }

  .touch-btn { pointer-events: auto; position: fixed; z-index: 6; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 66px; height: 66px; border-radius: 50%; border: 1px solid #3a4150; background: rgba(15,18,26,0.7); color: #e6e9ef; font-family: inherit; font-size: 20px; cursor: pointer; backdrop-filter: blur(3px); }
  .touch-btn:active { background: rgba(40,46,60,0.9); }
  #weapon-btn { left: 16px; bottom: 16px; }
  #weapon-icon { font-size: 22px; }
  #weapon-name { font-size: 10px; color: #ffd54f; margin-top: 1px; }
  #dash-btn { right: 16px; bottom: 16px; font-weight: 700; }
  #dash-cd { font-size: 10px; color: #90caf9; min-height: 13px; }
  #dash-btn.cooling { opacity: 0.45; }

  .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.62); z-index: 10; }
  .hidden { display: none !important; }
  .panel-overlay { background: #151821; border: 1px solid #2a2f3a; border-radius: 16px; padding: 26px 30px; max-width: 760px; width: min(94vw, 760px); max-height: 92vh; overflow-y: auto; text-align: center; box-shadow: 0 24px 70px rgba(0,0,0,0.6); color: #e6e9ef; }
  h1 { font-size: 32px; color: #ff5252; letter-spacing: 2px; margin-bottom: 4px; }
  .sub { color: #8b93a1; font-size: 13px; margin-bottom: 16px; }
  #best-stats { font-size: 13px; color: #c7ccd6; margin-bottom: 18px; }
  #best-stats b { color: #ffd54f; }

  .btn { pointer-events: auto; cursor: pointer; font-family: inherit; font-size: 16px; font-weight: 700; color: #fff; background: linear-gradient(180deg, #ef5350, #c62828); border: none; border-radius: 10px; padding: 12px 34px; letter-spacing: 2px; box-shadow: 0 6px 20px rgba(239,83,80,0.35); }
  .btn:hover { filter: brightness(1.1); }
  .btn:active { transform: translateY(1px); }
  .btn.ghost { background: #1d212c; border: 1px solid #343b49; box-shadow: none; }
  .btn-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }

  #char-cards { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .char-card { pointer-events: auto; cursor: pointer; font-family: inherit; width: 176px; background: #10131b; border: 2px solid #2a2f3a; border-radius: 12px; padding: 18px 12px; color: #e6e9ef; transition: transform .1s, border-color .1s; }
  .char-card.selected { border-color: #ffd54f; transform: translateY(-4px); }
  .char-card .icon { font-size: 42px; }
  .char-card .name { font-size: 17px; font-weight: 700; margin: 8px 0 4px; color: #ffd54f; }
  .char-card .desc { font-size: 12px; color: #aab0bb; line-height: 1.5; }
  .char-card .w { margin-top: 8px; font-size: 11px; color: #8b93a1; }

  #cards { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .card { pointer-events: auto; cursor: pointer; font-family: inherit; width: 176px; background: #10131b; border: 1px solid #2a2f3a; border-radius: 12px; padding: 18px 14px; color: #e6e9ef; transition: transform .1s, border-color .1s; }
  .card:hover { border-color: #ffd54f; transform: translateY(-4px); }
  .card .icon { font-size: 40px; }
  .card .name { font-size: 17px; font-weight: 700; margin: 8px 0 6px; color: #ffd54f; }
  .card .desc { font-size: 12px; color: #aab0bb; line-height: 1.5; }
  .card .key { margin-top: 10px; font-size: 11px; color: #5b6472; }

  #meta-coins { font-size: 18px; color: #ffd54f; font-weight: 700; margin-bottom: 14px; }
  #meta-list { display: flex; flex-direction: column; gap: 8px; text-align: left; }
  .meta-row { display: flex; align-items: center; gap: 12px; background: #10131b; border: 1px solid #262b36; border-radius: 10px; padding: 10px 14px; }
  .meta-row .icon { font-size: 26px; }
  .meta-row .info { flex: 1; }
  .meta-row .name { font-size: 15px; font-weight: 700; color: #e6e9ef; }
  .meta-row .pips { color: #ffd54f; font-size: 12px; }
  .meta-row .desc { font-size: 12px; color: #8b93a1; margin-top: 2px; }
  .buy-btn { pointer-events: auto; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 700; color: #fff; background: linear-gradient(180deg, #ffb300, #f57c00); border: none; border-radius: 8px; padding: 8px 16px; white-space: nowrap; }
  .buy-btn:disabled { background: #2a2f3a; color: #5b6472; cursor: default; }

  #go-stats { font-size: 16px; line-height: 1.9; margin-bottom: 18px; color: #c7ccd6; }
  #go-stats b { color: #ffd54f; }
  .pause-title { font-size: 26px; color: #ffd54f; margin-bottom: 6px; }
  @media (max-width: 600px) {
    .bar { width: 120px; }
    #wave-text { font-size: 17px; }
    .char-card, .card { width: 150px; }
    h1 { font-size: 26px; }
  }
  #rotate-hint { display: none; position: fixed; inset: 0; z-index: 200; background: #0b0d12; color: #e6e9ef; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; }
  #rotate-hint .rh-icon { font-size: 72px; animation: rhspin 2s ease-in-out infinite; }
  #rotate-hint .rh-text { font-size: 22px; letter-spacing: 3px; }
  @keyframes rhspin { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(90deg); } }
  @media (orientation: portrait) { #rotate-hint { display: flex; } }
</style>
</head>
<body>
<div id="rotate-hint"><div class="rh-icon">🔄</div><div class="rh-text">请将手机横屏游玩</div></div>
<canvas id="game"></canvas>

<div id="hud">
  <div class="top">
    <div class="panel">
      <div class="bar"><div id="hp-fill"></div></div>
      <span id="hp-text">100 / 100</span>
    </div>
    <div class="center">
      <div id="wave-text">第 1 波</div>
      <div id="enemies-text">剩余 0</div>
    </div>
    <div class="panel stats">
      <div id="coins">金币 0</div>
      <div id="kills">击杀 0</div>
      <div id="time">0:00</div>
    </div>
  </div>
  <div class="xp-wrap">
    <div class="xp-bar"><div id="xp-fill"></div></div>
    <span id="level-text">Lv.1</span>
  </div>
  <div id="buffs"></div>

  <button id="weapon-btn" class="touch-btn" title="切换武器 (Q)">
    <span id="weapon-icon">🔫</span>
    <span id="weapon-name">手枪</span>
  </button>
  <button id="dash-btn" class="touch-btn" title="冲刺 (空格)">
    <span>冲</span>
    <span id="dash-cd"></span>
  </button>
</div>

<div id="overlay" class="overlay hidden">
  <div id="menu" class="panel-overlay hidden">
    <h1>🧟 僵尸国度</h1>
    <div class="sub">Zombie Horde · 割草生存射击</div>
    <div id="best-stats"></div>
    <button id="btn-start" class="btn">开 始 游 戏</button>
    <div class="btn-row">
      <button id="btn-meta" class="btn ghost">🎯 天赋树</button>
      <button id="btn-reset" class="btn ghost">🗑 重置存档</button>
    </div>
    <div class="sub" style="margin-top:14px;margin-bottom:0;">移动：WASD/方向键/左侧摇杆 · 射击：自动 · 切换武器：Q 或左下按钮 · 冲刺：空格或右下按钮</div>
  </div>

  <div id="loadout" class="panel-overlay hidden">
    <h1 style="font-size:26px;color:#ffd54f;">选择角色</h1>
    <div class="sub">每种角色有不同的属性与起始武器</div>
    <div id="char-cards"></div>
    <div class="btn-row">
      <button id="btn-go" class="btn">出 发</button>
      <button id="btn-meta-back" class="btn ghost">返回</button>
    </div>
  </div>

  <div id="meta" class="panel-overlay hidden">
    <h1 style="font-size:26px;color:#ffd54f;">🎯 天赋树</h1>
    <div class="sub">用金币永久强化（局外养成，跨局保存）</div>
    <div id="meta-coins">总金币 0</div>
    <div id="meta-list"></div>
    <div class="btn-row">
      <button id="btn-goto-menu" class="btn ghost">返回主菜单</button>
    </div>
  </div>

  <div id="levelup" class="panel-overlay hidden">
    <h1 style="font-size:26px;color:#ffd54f;">⬆ 升级！三选一</h1>
    <div class="sub">选择一项强化</div>
    <div id="cards"></div>
    <div class="sub" style="margin-top:14px;margin-bottom:0;">按 1 / 2 / 3 快速选择</div>
  </div>

  <div id="pause" class="panel-overlay hidden">
    <div class="pause-title">⏸ 已暂停</div>
    <div class="sub">按 P / Esc 继续</div>
    <div class="btn-row">
      <button id="btn-resume" class="btn">继续</button>
      <button id="btn-mute" class="btn ghost">🔊 音效：开</button>
      <button id="btn-menu" class="btn ghost">主菜单</button>
    </div>
  </div>

  <div id="gameover" class="panel-overlay hidden">
    <h1>💀 你死了</h1>
    <div class="sub">僵尸吞没了你</div>
    <div id="go-stats"></div>
    <div class="btn-row">
      <button id="btn-again" class="btn">再 来 一 局</button>
      <button id="btn-goto-meta" class="btn ghost">天赋树</button>
      <button id="btn-goto-menu" class="btn ghost">主菜单</button>
    </div>
  </div>
</div>
